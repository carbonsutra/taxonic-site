openapi: 3.0.0
info:
  title: Taxonic
  version: 1.0.0
  description: >-
    # Taxonic


    ## Classification Engine for Books & Educational Assets


    Taxonic converts unstructured text such as book titles, academic course
    names, syllabus excerpts, and digital learning assets into standardized
    subject codes across publishing and higher education taxonomies.


    Taxonic is an API-first classification engine driven by local dense vector
    embeddings and indexing. Specifically optimized for academic publishers,
    university registrars, libraries, edtech platforms, and digital book
    distributors, Taxonic automates the mapping of unstructured content metadata
    to rigid global classification standards, including HECoS (Higher Education
    Classification of Subjects), BISAC, THEMA, UDC, LCC and Library of Congress
    Subject Headings (LCSH). By replacing slow, manual cataloging with real-time
    semantic and exact match indexing, Taxonic streamlines bulk intake, enriches
    metadata catalogs, and powers direct function calling for autonomous AI
    agents.


    Taxonic indexes major global standards across publishing, libraries, and
    higher education:


    | Standard Key | Full Standard Name |

    | --- | --- |

    | `LCSH` | Library of Congress Subject Headings |

    | `THEMA` | THEMA Subject Scheme (v1.7) |

    | `HECOS` | Higher Education Classification of Subjects (v9.0) |

    | `LCC` | Library of Congress Classification |

    | `UDC` | Universal Decimal Classification |

    | `BISAC` | Book Industry Standards and Communications (2021) |
servers:
  - url: "{{PRODUCTION}}"
paths:
  /v1/classify:
    post:
      summary: classify
      parameters:
        - name: title
          in: query
          description: Primary title of the asset
          schema:
            type: string
          example: ""
        - name: description
          in: query
          description: >-
            Description, keywords, metadata of the asset that helps in
            classification
          schema:
            type: string
          example: ""
        - name: standard
          in: query
          description: Standard used for classification
          schema:
            type: string
          example: ""
        - name: code_prefix
          in: query
          description: "Prefix of the code for narrowing search "
          schema:
            type: string
          example: ""
        - name: max_results
          in: query
          description: "Maximum number of returned results (Default: 5)"
          schema:
            type: string
          example: ""
        - name: min_score
          in: query
          description: "Minimum confidence score of Taxonic's algorithm (Default: 0.35)"
          schema:
            type: string
          example: ""
      responses: {}
      description: >-
        # Classification of Data


        ## Parameters:


        | Field | Type | Required | Default | Description |

        | --- | --- | --- | --- | --- |

        | `title` | String | **Yes** | — | Primary title or name of the asset. |

        | `description` | String | No | `null` | Contextual text, summary, or
        syllabus note. |

        | `standard` | String | **Yes** | — | Target classification standard
        (e.g., `hecos`, `thema`, `lcsh`). |

        | `code_prefix` | String | No | `null` | Filter results to codes
        starting with this prefix (e.g., `"101"`). |

        | `max_results` | Number | No | `5` | Maximum number of matches to
        return (1 to 20). |

        | `min_score` | Number | No | `0.35` | Minimum confidence score
        threshold (0.0 to 1.0). |
